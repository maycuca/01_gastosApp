# Tests never touch the real data directory: each application context gets a
# fresh throwaway SQLite file under target/ (removed by "mvnw clean").
spring.datasource.url=jdbc:sqlite:target/test-db/gastos-test-${random.uuid}.db
app.jwt.secret=gastosapp-test-secret-0123456789-0123456789-0123456789

# Data and frontend directories also live under target/. With the secret above
# and backups disabled, nothing is written to the data directory; tests that
# need it point app.dirs.data at their own temporary folder.
app.dirs.data=target/test-db/data
app.dirs.frontend=target/test-db/no-frontend
app.backup.enabled=false
