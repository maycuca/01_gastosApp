spring.application.name=gastosApp-backend
server.port=8080
# Only reachable from this machine unless GASTOS_BIND_ADDRESS says otherwise.
server.address=${GASTOS_BIND_ADDRESS:127.0.0.1}
spring.threads.virtual.enabled=true

# Host header check (DNS rebinding): localhost, 127.0.0.1 and [::1] are always
# allowed; GASTOS_ALLOWED_HOSTS adds more (comma-separated, optional :port).
app.security.allowed-hosts=${GASTOS_ALLOWED_HOSTS:}

# Directories (spec section 8). Without the variables, the defaults are relative
# to the backend module folder (app.backend-dir, set at startup from the location
# of the jar or target/classes), never to the working directory. Values given in
# the variables that are relative are resolved against the working directory.
app.dirs.data=${GASTOS_DATA_DIR:${app.backend-dir:.}/../data}
app.dirs.frontend=${GASTOS_FRONTEND_DIR:${app.backend-dir:.}/../gastosAppFronend/dist}

# SQLite. WAL journal mode, foreign keys and busy timeout are applied to every
# connection in DataSourceConfig; the pool is limited to a single connection
# to avoid SQLITE_BUSY.
spring.datasource.url=jdbc:sqlite:${app.dirs.data}/gastos.db
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.pool-name=gastos-sqlite

# Schema is created by schema.sql (idempotent) on startup.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.mvc.format.date=iso

# The compiled frontend is served by FrontendConfig, not by Spring Boot's default
# static locations.
spring.web.resources.add-mappings=false

# JWT. There is no default secret: without JWT_SECRET a random one is generated
# on first start and kept in <data dir>/jwt-secret (owner-only permissions).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=24h

# Login attempts (spec section 1): usernames tracked in memory at most.
app.login.max-tracked-usernames=10000

# Backups (spec section 8): <data dir>/backups/gastos-YYYY-MM-DD.db.
app.backup.enabled=true
app.backup.keep=14
app.backup.interval=24h
